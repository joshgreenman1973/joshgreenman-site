name: Refresh writing and experiments

# Rebuilds the two auto-generated blocks in index.html from the live sources
# and commits only if something actually changed. A push to main is what
# triggers the GitHub Pages deploy, so a no-op run costs nothing.

on:
  schedule:
    - cron: "17 11 * * *"      # 11:17 UTC daily, roughly 7am New York
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build.py"
      - "data/overrides.json"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build.py exits non-zero if any source is empty or implausible, which
      # fails the run instead of publishing a hollowed-out page.
      - name: Rebuild
        run: python3 build.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh latest writing and experiments"
          git push
